<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prototype Playground</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      color: #1a1a1a;
      background: #fafafa;
      padding: 48px 24px;
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 48px;
      padding-bottom: 24px;
      border-bottom: 1px solid #e5e5e5;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      font-size: 15px;
    }

    h2 {
      font-size: 18px;
      font-weight: 600;
      margin: 32px 0 16px;
    }

    .prototype-list {
      list-style: none;
    }

    .prototype-list li {
      padding: 16px 0;
      border-bottom: 1px solid #eee;
    }

    .prototype-list li:last-child {
      border-bottom: none;
    }

    .prototype-list a {
      color: #1a1a1a;
      text-decoration: none;
      font-weight: 500;
      display: block;
    }

    .prototype-list a:hover {
      color: #0066cc;
    }

    .prototype-meta {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
    }

    .empty-state {
      padding: 24px;
      background: #fff;
      border: 1px dashed #ccc;
      border-radius: 8px;
      text-align: center;
      color: #888;
      font-size: 14px;
    }

    footer {
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid #e5e5e5;
      font-size: 13px;
      color: #888;
    }

    code {
      background: #f0f0f0;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      font-family: "SF Mono", Monaco, monospace;
    }
  </style>
</head>
<body>
  <header>
    <h1>Prototype Playground</h1>
    <p class="subtitle">A space for quick HTML prototypes and design experiments.</p>
  </header>

  <h2>Prototypes</h2>

  <ul class="prototype-list">
    <!--
      Add prototypes here as you build them. Example:
      <li>
        <a href="./prototypes/example/">Example prototype</a>
        <div class="prototype-meta">Added Nov 2026</div>
      </li>
    -->
  </ul>

  <div class="empty-state">
    No prototypes yet. Add a folder under <code>/prototypes/</code> and link it here.
  </div>

  <footer>
    A personal playground for HTML prototypes.
  </footer>
</body>
</html>
